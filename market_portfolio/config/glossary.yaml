# 초심자 가이드 단일 출처 (F18). tip = 툴팁 한 줄, body = 가이드 페이지 본문.
# AI 해설(F20)의 근거 자료로도 쓰이므로 숫자·단정 표현을 넣지 않는다.
regime_score:
  label: 국면 점수
  tip: 10개 지표의 우호(+1)·중립(0)·비우호(−1) 신호를 더한 값(−10~+10). +4 이상 확장, −4 이하 위험회피
  body: >
    두 속도로 봅니다. 매크로 층 6개(유동성·원자재·시장 폭·신용·금리곡선·달러)는 느리게 움직이는
    자금 흐름이고 5거래일 연속 유지돼야 전환으로 인정합니다. 시장 층 4개(VIX·추세·낙폭·섹터 폭·단기금리 변동)는
    빠르게 움직이는 가격과 변동성이고 2거래일 확정입니다. 합이 +4 이상은 확장, −4 이하는 위험회피,
    그 사이는 중립·전환입니다. VIX가 30 이상이거나 나스닥100이 고점 대비 20% 넘게 빠지면
    점수와 관계없이 '위험회피(급변)'으로 표시합니다.
p_down:
  label: 하락 확률
  tip: 과거 반응 분포로 시뮬레이션한 다음 날 하락 확률
  body: >
    과거 실적 발표 다음 날 반응으로 만든 분포에서 여러 번 표본을 뽑아,
    하락으로 끝난 비율을 셉니다. 표본 수가 적으면 회색 "참고용"으로 표시합니다.
interval90:
  label: 90% 구간
  tip: 시뮬레이션 결과의 5~95 백분위 범위
  body: >
    시뮬레이션 결과를 작은 값부터 늘어놓았을 때 5%와 95% 위치 사이 범위입니다.
    아래쪽 끝은 과거 분포 기준으로 나타날 수 있는 손실 크기를 보여줍니다.
car:
  label: 누적 초과수익률(CAR)
  tip: 실적일을 0일로 맞춰 벤치마크 대비 초과수익을 누적한 값
  body: >
    그룹 종목들의 실적 발표일을 같은 0일로 정렬하고, 벤치마크 대비 초과수익을
    날짜별로 더해 평균을 냅니다. 실적 시즌에 그룹이 어떻게 움직였는지 보여줍니다.
liquidity:
  label: 유동성
  tip: GDP 전년비 − 기준금리 ≥ 0.5%p이고 금리 동결·인하면 우호, 0~0.5%p면 중립
  body: >
    경제가 커지는 속도(명목 GDP 전년비)가 돈의 값(기준금리)보다 빠르면 기업과 시장에
    여유 자금이 생기기 쉽습니다. 최근 6개월 금리 인상이나 이 차이의 빠른 축소는 비우호로 봅니다.
    GDP는 분기 말 약 한 달 뒤 발표되므로 발표된 값만 씁니다.
commodity:
  label: 원자재
  tip: 원자재 종합(DBC)이 200일 평균보다 1% 넘게 위면 우호, ±1%면 중립
  body: >
    원자재 가격이 오르는 흐름은 수요가 살아 있다는 신호로 읽힙니다. 200일 평균은 약 10개월의
    추세선입니다. 52주 고점과의 거리도 함께 보여줍니다.
breadth:
  label: 시장 폭
  tip: RSP/SPY가 200일 평균보다 1% 넘게 위면 우호, ±1%면 중립 — 소수 대형주만 오르는지 확인
  body: >
    RSP/SPY 비율이 오르면 많은 종목이 함께 오르는 넓은 상승입니다. 지수(SPY)는 고점 근처인데
    이 비율이 고점보다 5% 넘게 낮으면 소수 종목에 기댄 상승(괴리)으로 보고 비우호로 표시합니다.
credit:
  label: 신용
  tip: 하이일드 스프레드가 3개월 0.1%p 넘게 줄면 우호, ±0.1%p면 중립 (값은 라이선스상 비공개)
  body: >
    위험한 회사채가 국채보다 얼마나 더 높은 금리를 줘야 팔리는지(스프레드)는 시장의 불안을
    보여줍니다. 줄어들면 위험 선호, 늘어나면 위험 회피입니다. 원 데이터(ICE BofA)는 제3자 공개가
    금지돼 방향만 표시합니다.
curve:
  label: 금리곡선
  tip: 역전 해소 6개월 뒤 10Y−2Y ≥ 0.25%p면 우호, 0~0.25%p면 중립, 역전·해소 직후는 비우호
  body: >
    단기 금리가 장기 금리보다 높은 역전은 과거 경기 둔화 전에 자주 나타났습니다. 특히 역전이
    풀린 직후 6개월은 둔화가 실제로 시작되던 구간이 많아 비우호로 봅니다.
dollar:
  label: 달러
  tip: 달러가 200일 평균보다 1% 넘게 약하면 우호, ±1%면 중립, 6개월 3% 넘게 오르면 비우호
  body: >
    달러가 강해지면 세계 자금이 미국 현금·국채로 몰리고 위험자산과 원자재에 부담이 되는 경우가
    많습니다. 연준이 발표하는 광의 달러지수를 씁니다.
vix:
  label: VIX
  tip: S&P500 옵션으로 본 향후 30일 예상 변동성. 17 미만 우호, 17~25 중립, 25 이상 비우호 (시장 층)
  body: >
    시장 참가자들이 앞으로 한 달 동안 주가가 얼마나 크게 움직일 것으로 보는지를 연율 %로 나타낸
    지수입니다. 평소 10~20 사이에 머물고, 급락기에는 30~40 이상으로 뛰기도 합니다. 30 이상이면
    급변 규칙이 발동합니다.
trend:
  label: 추세·낙폭
  tip: S&P500·나스닥100이 모두 200일선 위이고 고점 대비 −5% 이내면 우호, 하나라도 200일선 아래이거나 −10% 이하면 비우호 (시장 층)
  body: >
    대표 지수가 장기 추세선(200일 평균) 위에 있는지와 52주 고점에서 얼마나 내려왔는지(낙폭)를 함께 봅니다.
    나스닥100이 고점 대비 20% 넘게 빠지면 급변 규칙이 발동합니다.
sectors:
  label: 섹터 폭
  tip: SPDR 섹터 ETF 11개 중 200일선 위에 있는 비율. 60% 이상 우호, 40% 미만 비우호 (시장 층)
  body: >
    상승이나 하락이 몇몇 업종에 몰려 있는지, 시장 전체로 퍼져 있는지를 봅니다. 시장 폭(RSP/SPY)이
    종목 단위의 쏠림을 본다면 섹터 폭은 업종 단위의 확산을 봅니다.
rates:
  label: 단기금리 변동
  tip: 미 국채 2년물의 1개월 변화. ±0.10%p 이내면 우호, +0.25%p 이상(긴축 쇼크) 또는 −0.50%p 이하(위기성 급락)면 비우호 (시장 층)
  body: >
    2년물은 기준금리 기대를 가장 빠르게 반영합니다. 한 달 사이 크게 오르면 긴축 충격, 크게 내리면
    경기 충격이나 안전자산 쏠림인 경우가 많아 둘 다 위험자산에 비우호로 봅니다. 잔잔하면 우호입니다.
stress:
  label: 급변 규칙
  tip: VIX ≥ 30 또는 나스닥100 고점 대비 −20% 이하면 점수와 관계없이 '위험회피(급변)'
  body: >
    국면 점수는 여러 지표를 더하기 때문에 큰 충격이 와도 느린 지표가 버티면 0 근처에 머물 수 있습니다.
    그런 경우를 놓치지 않도록 두 가지 급변 조건 중 하나라도 맞으면 확정 기간 없이 바로 위험회피로 표시합니다.
