# 모델 기본값과 보정 관문 (PLAN.md §4, §7)
simulation:
  n_iter: 400000
  n_iter_preview: 50000
  seed: 20261125
  horizons: [1, 5, 21, 63]

mixture:                   # §7.0 태그 없는 기본 모델
  nu: 4                    # t 분포 자유도 (고정)
  kappa: 5                 # 그룹 사전분포 가상 표본 수
  min_group_events: 15     # 그룹 사전분포 적합 최소 표본

calibration_gate:          # 미통과 시 회색 "참고용"
  brier_max: 0.25
  coverage90_min: 0.85
  coverage90_max: 0.95
  min_events: 20

macro:
  compare_base_months: 6     # 3 / 6 / 12 선택
  regime_expansion_min: 4    # 점수 >= +4 (v0.21: 10개 지표, −10~+10)
  regime_riskoff_max: -4     # 점수 <= -4
  confirm_days: 5            # 매크로 층: 신호 5거래일 유지 시 전환 인정
  neutral:                   # 지표별 중립(0) 구간 — 이 안이면 우호도 비우호도 아님 (v0.14 결정 B)
    ma_band: 0.01            # 원자재·시장 폭·달러: 200일선 ±1% 이내
    liquidity_gap: 0.5       # 유동성: GDP 전년비 − 기준금리가 0~0.5%p
    credit_d3m: 0.10         # 신용: 하이일드 스프레드 3개월 변화 ±0.10%p 이내
    curve_flat: 0.25         # 금리곡선: 역전 해소 6개월 후에도 10Y−2Y가 0~0.25%p
  market:                    # 시장 층 (빠름, v0.21) — 경계는 macro-eval 검증으로 조정
    confirm_days: 2
    vix: [17, 25]            # 미만 우호 / 이상 비우호
    trend_ok_dd: -0.05       # S&P500·나스닥100 모두 200일선 위 + 고점 대비 −5% 이내 → 우호
    trend_bad_dd: -0.10      # 어느 하나라도 200일선 아래 또는 −10% 이하 → 비우호
    sectors: [0.40, 0.60]    # 200일선 위 섹터 ETF 비율: 40% 미만 비우호 / 60% 이상 우호
    sectors_min: 8
    rates_calm: 0.10         # 2년물 1개월(21거래일) 변화 |Δ| ≤ 0.10%p → 우호
    rates_up: 0.25           # Δ ≥ +0.25%p → 비우호 (긴축 쇼크)
    rates_down: -0.50        # Δ ≤ −0.50%p → 비우호 (위기성 급락)
    stress_vix: 30           # 급변: VIX ≥ 30
    stress_ndx_dd: -0.20     # 급변: 나스닥100 고점 대비 −20% 이하
    stress_exit_vix: 25      # 급변 해제: VIX 25 미만이고
    stress_exit_ndx_dd: -0.15  #         나스닥100이 고점 대비 −15%보다 회복한 날이
    stress_exit_days: 5      #         5거래일 연속 (v0.22 히스테리시스)

valuation:                   # IV. 밸류에이션 (후행 P/E·P/FCF, 선행 P/E 누적)
  start: "2016-01-01"        # 그래프 시작 (TTM 4분기 확보 후)
  av_daily_calls: 20         # Alpha Vantage 무료 25회/일 중 사용량 (종목당 2회)
  max_age_days: 90           # 재무제표 다시 받는 주기
  report_lag_days: 45        # 분기 말 → 반영일 (미래 정보 누수 방지)
  priority: [bigtech, semis] # 먼저 채울 그룹

ai:                          # F20 AI 해설 (로컬 Ollama, PLAN §8.1). 맥미니 실측 4b 35 tok/s (11-26)
  pregen_model: gemma3:12b   # 매일 배치 미리 생성 (끝나면 메모리에서 내림)
  chat_model: gemma3:4b      # 2단계 자유 질문 (상주)
  pregen_timeout_s: 180      # 1건 제한
  pregen_budget_s: 1500      # 배치 전체 제한 — 넘으면 남은 건 템플릿
  max_tickers: 5             # 실적이 가까운 종목 해설 수
  ticker_days: 14            # 실적까지 남은 일수
  num_predict: 400           # 답변 최대 토큰
  temperature: 0.2
  # 2단계 자유 질문 (오른쪽 패널, gemma3:4b 실측 35 tok/s)
  chat_timeout_s: 60         # 1건 제한
  chat_num_predict: 400
  chat_keep_alive: 30m       # 질문 뒤 30분 상주 (12b 미리 생성과 겹치면 느려질 수 있음)
  session_daily: 10          # 브라우저 세션당 하루
  global_daily: 600          # 전체 하루
  max_question_chars: 500
  queue_max: 3               # 동시 1건 + 대기 3건 (OLLAMA_NUM_PARALLEL=1)
  evidence_chars: 3500       # 근거 상한 (약 3,000토큰 이하)
